name: LMTR R4 targeted API35 diagnostic
# Push works for a new workflow on a non-default branch. Do not add workflow_dispatch:
# this file is not on main, and pushing the historical R4 branch launches its full matrix.
'on':
  push:
    branches: [codex/r4-api35-first-failure-replay]
permissions:
  contents: read
concurrency:
  group: lmtr-r4-api35-targeted-${{ github.ref }}
  cancel-in-progress: false
jobs:
  targeted-api35:
    if: github.repository == 'LounaMaili/LMThermal' && github.event_name == 'push' && github.ref == 'refs/heads/codex/r4-api35-first-failure-replay'
    runs-on: ubuntu-24.04
    # Leave room for bounded build/instrumentation/collection watchdogs and artifact upload.
    timeout-minutes: 80
    env:
      GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx1536m -Dorg.gradle.workers.max=2 -Dkotlin.daemon.jvm.options=-Xmx768m'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Preserve exact source before emulator preparation
        # runner context is valid at step scope; use the same independent value in all three steps.
        env:
          LMTR_API35_REPORTS: ${{ runner.temp }}/lmtr-r4-api35-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          umask 077
          mkdir -m 700 "$LMTR_API35_REPORTS"
          git rev-parse HEAD > "$LMTR_API35_REPORTS/source-sha.txt"
          git status --porcelain > "$LMTR_API35_REPORTS/checkout-status.txt"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          sha256sum --check docs/lmtr-r4/api35-targeted-reviewed-sources.sha256 > "$LMTR_API35_REPORTS/reviewed-sources.txt"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          keys = ('GITHUB_SHA', 'GITHUB_REF', 'GITHUB_REPOSITORY', 'GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT', 'GITHUB_JOB', 'RUNNER_OS', 'RUNNER_ARCH')
          path = Path(os.environ['LMTR_API35_REPORTS']) / 'workflow-context.json'
          with path.open('x') as output:
              json.dump({key: os.environ.get(key) for key in keys}, output, indent=2)
          PY
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: KVM setup on disposable hosted runner only
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Only the finite replay on a camera-disabled API35 emulator
        env:
          LMTR_API35_REPORTS: ${{ runner.temp }}/lmtr-r4-api35-${{ github.run_id }}-${{ github.run_attempt }}
        timeout-minutes: 70
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -camera-back none -camera-front none
          script: python3 tools/validate_lmtr_r4_api35.py "$LMTR_API35_REPORTS/replay"
      - name: Retain available evidence even on preparation or runtime failure
        env:
          LMTR_API35_REPORTS: ${{ runner.temp }}/lmtr-r4-api35-${{ github.run_id }}-${{ github.run_attempt }}
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lmtr-r4-api35-targeted-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.LMTR_API35_REPORTS }}/
          retention-days: 30
          if-no-files-found: error
