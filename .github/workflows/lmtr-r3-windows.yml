name: LMTR R3 native Windows

on:
  push:
    branches: [feat/lmtr-r3-contract-conformance]

permissions:
  contents: read

concurrency:
  group: lmtr-r3-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-windows:
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      # Bound cold Gradle/Kotlin builds; runtime probes have their own heap caps.
      GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx1536m -Dorg.gradle.workers.max=2 -Dkotlin.daemon.jvm.options=-Xmx768m'
    steps:
      - name: Checkout exact pushed commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Prepare unique evidence outside checkout
        run: |
          $reports = Join-Path $env:RUNNER_TEMP "lmtr-r3-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          New-Item -ItemType Directory -Path $reports | Out-Null
          @{
            run_url = "https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            sha = $env:GITHUB_SHA
            ref = $env:GITHUB_REF
            run_attempt = $env:GITHUB_RUN_ATTEMPT
            runner_image = $env:ImageOS
            runner_image_version = $env:ImageVersion
          } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $reports 'workflow-context.json') -Encoding utf8
          "LMTR_R3_REPORTS=$reports" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Native Windows contract and NTFS validation
        timeout-minutes: 35
        run: |
          # The script creates its own new subdirectory and refuses a dirty/wrong SHA source.
          & .\tools\test_lmtr_r3_windows.ps1 -ReportDirectory (Join-Path $env:LMTR_R3_REPORTS 'preflight-guards')
          $reports = Join-Path $env:LMTR_R3_REPORTS 'validation'
          & .\tools\validate_lmtr_r3_windows.ps1 -ExpectedCommit $env:GITHUB_SHA -ReportDirectory $reports -NtfsSparse -SparseTempRoot $env:RUNNER_TEMP
      - name: Preserve reports and failed-test logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lmtr-r3-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/lmtr-r3-${{ github.run_id }}-${{ github.run_attempt }}/
            lmtr-contract/build/test-results/test/
            lmtr-contract/build/reports/tests/test/
          if-no-files-found: warn
          retention-days: 30
